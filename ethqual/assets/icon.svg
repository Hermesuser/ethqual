<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B24"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Squircle container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="#2A3140" stroke-width="8"/>
  <!-- Minimalist RJ45 / Ethernet port frame -->
  <path d="M148 164 H364 A20 20 0 0 1 384 184 V308 A20 20 0 0 1 364 328 H312 V356 A12 12 0 0 1 300 368 H212 A12 12 0 0 1 200 356 V328 H148 A20 20 0 0 1 128 308 V184 A20 20 0 0 1 148 164 Z"
        fill="none" stroke="url(#accent)" stroke-width="18" stroke-linejoin="round"/>
  <!-- 4 minimalist contact pins -->
  <line x1="196" y1="168" x2="196" y2="212" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <line x1="236" y1="168" x2="236" y2="212" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <line x1="276" y1="168" x2="276" y2="212" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <line x1="316" y1="168" x2="316" y2="212" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <!-- Signal / Link qualification pulse -->
  <polyline points="168,274 214,274 236,240 264,302 288,256 306,274 344,274"
            fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
