name: Build Native Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_id: macos-arm64
            pyinstaller_args: '--windowed --name ethqual --osx-bundle-identifier com.ethqual.app --icon ethqual/assets/icon.icns --add-data "ethqual/assets/icon.png:ethqual/assets"'
            installer_file: ethqual-macos-arm64.dmg
          - os: macos-15-intel
            platform_id: macos-intel-x86_64
            pyinstaller_args: '--windowed --name ethqual --osx-bundle-identifier com.ethqual.app --icon ethqual/assets/icon.icns --add-data "ethqual/assets/icon.png:ethqual/assets"'
            installer_file: ethqual-macos-intel-x86_64.dmg
          - os: windows-latest
            platform_id: windows-11-x64
            pyinstaller_args: '--windowed --onefile --name ethqual --icon ethqual/assets/icon.ico --add-data "ethqual/assets/icon.png;ethqual/assets"'
            installer_file: ethqual-setup-windows-x64.exe
          - os: ubuntu-latest
            platform_id: linux-x86_64
            pyinstaller_args: '--onefile --name ethqual --icon ethqual/assets/icon.png --add-data "ethqual/assets/icon.png:ethqual/assets"'
            installer_file: ethqual-linux-amd64.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PySide6 pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build native binary
        shell: bash
        run: pyinstaller --noconfirm ${{ matrix.pyinstaller_args }} gui.py

      - name: Build macOS DMG installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh "${{ matrix.installer_file }}"

      - name: Build Windows Setup EXE (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              choco install innosetup -y --no-progress
            }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\windows\ethqual.iss

      - name: Build Linux DEB package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh "0.2.0" "${{ matrix.installer_file }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_id }}
          path: dist/${{ matrix.installer_file }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
